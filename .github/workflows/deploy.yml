name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

# Avoid overlapping deploys racing on the gh-pages branch.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # Use `npm install` rather than `npm ci`: the lockfile is generated by a
        # newer npm (Node 26 locally) than CI's, and `npm ci` rejects the
        # resulting tree as out of sync. `npm install` reconciles it and builds.
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          # react-scripts treats warnings as errors when CI is set; keep the
          # build resilient to the (non-fatal) CRA/babel deprecation warnings.
          CI: false

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
